# Clean install on Windows Server 2022, Linux and macOS: the README's four
# commands with no Node (the UI is committed in the package), the demo smoke
# test and a fast test subset.
#
# Manual only (Actions minutes): never runs on push or pull request.
#   gh workflow run clean-install.yml --ref varianz/ready
#   gh run watch        # or: gh run list --workflow clean-install.yml
name: clean-install

on:
  workflow_dispatch:
    inputs:
      full_demo:
        description: "Also run the full-size demo (a few minutes per OS)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 = Windows Server 2022, the VARIANZ server's OS (pinned, not -latest)
        os: [windows-2022, ubuntu-latest, macos-latest]
    env:
      # Keep the data directory inside the runner's temp space.
      EXPLANEAT_HOME: ${{ github.workspace }}/../explaneat-home
      OMP_NUM_THREADS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The post-job `uv cache prune` failed on windows-2022 (exit 2, a file
          # still locked) after every real step had passed. Pruning only trims the
          # Actions cache, so skip it.
          prune-cache: false

      - name: Python 3.12 via uv
        run: uv python install 3.12

      # The four commands' install part, with no setup-node and Node hidden:
      # the runner images ship a Node, so every directory holding a node
      # executable is dropped from PATH inside this step (step-local, so the
      # Windows PATH of later steps is untouched).
      - name: uv sync, setup, doctor (no Node on PATH)
        run: |
          UV="$(command -v uv)"   # resolved before PATH is filtered
          while NODE="$(command -v node)"; do
            echo "hiding $NODE"
            export PATH="$(echo "$PATH" | tr ':' '\n' | grep -vxF "$(dirname "$NODE")" | paste -sd: -)"
          done
          if command -v npm; then echo "npm still on PATH"; exit 1; fi
          "$UV" sync --extra survival
          "$UV" run python -m explaneat setup
          "$UV" run python -m explaneat doctor | tee doctor.log
          grep -q "React Explorer build .*matches web/react-explorer source" doctor.log

      - name: Demo (tiny)
        run: uv run python -m explaneat demo --tiny --out demo_output

      - name: Demo (full size)
        if: ${{ inputs.full_demo }}
        run: uv run python -m explaneat demo --out demo_output_full

      - name: pytest -m smoke
        run: uv run pytest -m smoke -q -p no:cacheprovider

      - name: Fast test subset
        run: >
          uv run pytest -q -p no:cacheprovider -m "not slow"
          tests/test_core tests/test_survival tests/test_api tests/test_mcp tests/test_install
          tests/test_verify/test_tool_gaps.py tests/test_plain_language/test_survival_templates.py

      - name: Portal batch (CSV import, 2 seeds in worker processes, report)
        run: uv run pytest -q -p no:cacheprovider tests/test_api/test_portal.py

      - name: API serves the UI and answers
        run: |
          uv run python -m explaneat api --port 8765 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8765/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8765/api/experiments?limit=5"
          cat api.log

      - name: Upload demo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.os }}
          path: |
            demo_output/report.md
            demo_output/report.html
            api.log
            doctor.log
          if-no-files-found: ignore
