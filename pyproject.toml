[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explaneat"
version = "0.1.0"
description = "A suite of tools for creating explanations of neural networks trained using the PropNEAT algorithm"
readme = "README.md"
# torch 2.2.x (pinned below) publishes wheels for Python 3.8-3.12 only.
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Mike the Merry", email = "your-email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["neat", "neuroevolution", "neural-networks", "explainable-ai", "machine-learning"]
dependencies = [
    # Core dependencies. torch stays on 2.2.x, the last series built against
    # numpy 1.x; numpy is held below 2.0 for the stored genome / dataset arrays
    # and the pinned scientific stack.
    "torch>=2.2.0,<2.3.0",
    "neat-python==0.92",
    "numpy>=1.26.0,<2.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    # Visualization
    "matplotlib>=3.3.0",
    "graphviz>=0.16",
    "opencv-python>=4.5.0,<4.12",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
    # Data handling
    "pmlb>=1.0.0",
    # Experiment management
    "jsonschema>=3.2.0",
    "psutil>=5.8.0",
    "click>=8.0.0",
    # Optional dependencies for extended functionality
    "GitPython>=3.1.0",
    # Additional dependencies for compatibility
    "scipy>=1.16.0",
    # Symbolic math for annotation function extraction
    "sympy>=1.12",
    # XAI evidence
    "shap>=0.43.0",
    # Database dependencies
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    # API dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
git = [
    "GitPython>=3.1.0",
]
# Cox proportional-hazards / survival extension (explaneat.survival).
# The core Cox loss, Breslow baseline and Harrell's C are torch + numpy only;
# these provide the Cox comparator, Uno's C, time-dependent AUC, IPCW Brier
# and the bundled public datasets (GBSG2, WHAS500, ...) used for validation.
survival = [
    "scikit-survival>=0.24",
    "lifelines>=0.29",
]

[project.scripts]
explaneat = "explaneat.cli:cli"

[project.urls]
Homepage = "https://github.com/mikethemerry/explaneat"
Repository = "https://github.com/mikethemerry/explaneat"
Issues = "https://github.com/mikethemerry/explaneat/issues"

[tool.setuptools.packages.find]
include = ["explaneat*", "mcp_server*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.cfg", "*.ini"]
explaneat = ["static/react_explorer/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "db: marks tests as database tests",
    "cli: marks tests as CLI tests",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "smoke: fast end-to-end install checks (CI runs pytest -m smoke)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["explaneat"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[dependency-groups]
# Installed by a plain `uv sync` (uv's default "dev" group).
dev = [
    "pytest>=9.0.1",
    "httpx>=0.27",
]

# Linux and Windows get the CPU-only torch build (no multi-GB CUDA wheels);
# macOS wheels on PyPI are already CPU/MPS. For a CUDA build see README.md
# ("Dependencies").
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
