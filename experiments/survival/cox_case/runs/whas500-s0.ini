# Cox survival runs (experiments/survival/run_seed.py). Derived from
# experiments/10seed/configs/heart.ini: weights and biases are learned by
# backprop (weight/bias mutation off), topology by NEAT. num_inputs is
# overwritten by the runner with the number of model columns.
# fitness = -(Efron Cox loss) - AIC parsimony penalty, always negative (the
# null model scores about -5 to -7), so fitness_threshold = 999 never
# triggers: runs stop on generations. The output activation is identity (set
# by the runner, recorded in config_json["training"] in DB mode).
# weight_init_stdev = 0.1 (protocol v3; heart.ini has 1.0): new connections start
# at Cox-coefficient scale (|log-HR per SD| is typically < 1) instead of a large
# random perturbation that 5 backprop epochs per generation cannot undo.
[NEAT]
pop_size = 150
fitness_criterion = max
fitness_threshold = 999.0
reset_on_extinction = False


[DefaultGenome]
activation_default = relu
activation_mutate_rate = 0.0
activation_options = relu
aggregation_default = sum
aggregation_mutate_rate = 0.0
aggregation_options = sum
bias_init_mean = 0.0
bias_init_stdev = 1.0
bias_max_value = 30.0
bias_min_value = -30.0
bias_mutate_power = 0.0
bias_mutate_rate = 0.0
bias_replace_rate = 0.0
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient = 0.5
conn_add_prob = 0.5
conn_delete_prob = 0.3
enabled_default = True
enabled_mutate_rate = 0.1
feed_forward = True
initial_connection = full_direct
node_add_prob = 0.4
node_delete_prob = 0.2
num_hidden = 0
num_inputs = 14
num_outputs = 1
response_init_mean = 1.0
response_init_stdev = 0.0
response_max_value = 30.0
response_min_value = -30.0
response_mutate_power = 0.0
response_mutate_rate = 0.0
response_replace_rate = 0.0
weight_init_mean = 0.0
weight_init_stdev = 0.1
weight_max_value = 30.0
weight_min_value = -30.0
weight_mutate_power = 0.0
weight_mutate_rate = 0.0
weight_replace_rate = 0.0

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation = 15
species_elitism = 2

[DefaultReproduction]
elitism = 2
survival_threshold = 0.2
